<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · BuildForge</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0e;
        color: #edebe7;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        border: 1px solid #26262f;
        display: grid;
        place-items: center;
        background: #14141b;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #a3a1ab; font-size: 14px; line-height: 1.6; max-width: 34ch; margin: 0 auto 20px; }
      code { color: #6f6d78; font-size: 12px; }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round">
          <path d="M3 15h9l2 3H5l-2-3Zm11 3h6l1-2h-5l-2 2Zm-2-3 4.5-7.5L15 5l-5 7 2 3Z" />
          <defs>
            <linearGradient id="g" x1="4" y1="20" x2="20" y2="4" gradientUnits="userSpaceOnUse">
              <stop stop-color="#a5a1ff" />
              <stop offset="0.55" stop-color="#ef4652" />
              <stop offset="1" stop-color="#e4b54a" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        BuildForge is cached on this device. Pages you've visited before still work —
        reconnect to sync the latest meta.
      </p>
      <code>Reconnect and reload for the nightly-fresh data.</code>
    </div>
  </body>
</html>
